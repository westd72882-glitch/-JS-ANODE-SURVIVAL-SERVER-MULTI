name: Build APK
# Адрес сервера по умолчанию зашит ниже; можно переопределить переменной SERVER_URL (Settings → Variables)
# Для подписи release: секреты KEYSTORE_BASE64 и KEYSTORE_PASSWORD (алиас ключа: anode). Без них соберётся debug-APK.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия игры (должна совпадать с version в serverconfig.txt сервера)'
        required: false
        default: '16.9'
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Сборка веб-части (обфускация, шифрование ресурсов и кода)
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          APP_VERSION: ${{ github.event.inputs.version || vars.APP_VERSION || '16.9' }}
          SERVER_URL: ${{ vars.SERVER_URL || 'https://js-anode-survival-server-multi.onrender.com' }}
        run: |
          npm i --no-save three@0.128.0 javascript-obfuscator@4
          mkdir -p ws/js && cp -r index.html css assets 1 ws/ && cp js/*.js ws/js/ && cp node_modules/three/build/three.min.js ws/
          SIG=""; [ -n "$APP_SECRET" ] && SIG=$(printf '%s' "$APP_VERSION:$APP_SECRET" | sha256sum | cut -d" " -f1)
          sed -i "s/^window.__APP_VER=.*/window.__APP_VER='$APP_VERSION';/; s/^window.__APP_SIG=.*/window.__APP_SIG='$SIG';/" ws/js/version.js
          grep -c "$APP_VERSION" ws/js/version.js
          for f in ws/js/*.js; do
            [ "$f" = "ws/js/register-sw.js" ] && continue
            npx javascript-obfuscator "$f" --output "$f" --compact true --string-array true --string-array-encoding base64 --string-array-threshold 0.75 --identifier-names-generator hexadecimal
          done
          node tools/pack.js ws www
          npx javascript-obfuscator www/b.js --output www/b.js --compact true --control-flow-flattening true --control-flow-flattening-threshold 0.6 --dead-code-injection true --dead-code-injection-threshold 0.3 --string-array true --string-array-encoding rc4 --string-array-threshold 1 --identifier-names-generator hexadecimal --split-strings true --split-strings-chunk-length 5
          ls -la www
      - name: Capacitor + Android
        run: |
          # sharp ставим ВМЕСТЕ с capacitor: отдельный `npm i --no-save` вычищает пакеты, не записанные в package.json (в т.ч. @capacitor/android)
          npm i --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 sharp
          npx cap init "ANODE SURVIVAL" com.anode.survival --web-dir www
          npx cap add android
          npx cap sync android
          # Иконка приложения: Capacitor ставит свою стандартную, поэтому подменяем её на нашу (1/icon-512.png)
          R=android/app/src/main/res
          rm -f $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
          rm -f $R/drawable-v24/ic_launcher_foreground.xml $R/drawable/ic_launcher_background.xml
          node tools/make-icons.js
          M=android/app/src/main/AndroidManifest.xml
          # allowBackup уже есть в шаблоне манифеста — заменяем значение, а не добавляем дубль атрибута
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' $M
          grep -q 'android:screenOrientation' $M || sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' $M
          # Иммерсивный полноэкранный режим: скрываем статус-бар (время/заряд/сеть) и навигацию, вырез камеры закрашиваем игрой
          D=android/app/src/main/java/com/anode/survival
          mkdir -p $D
          cat > $D/MainActivity.java <<'EOF3'
          package com.anode.survival;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle b) { super.onCreate(b); hideBars(); }
              @Override public void onResume() { super.onResume(); hideBars(); }
              @Override public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }
              private void hideBars() {
                  Window w = getWindow();
                  WindowCompat.setDecorFitsSystemWindows(w, false);
                  w.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = w.getAttributes();
                      lp.layoutInDisplayCutoutMode = Build.VERSION.SDK_INT >= 30
                          ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                          : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      w.setAttributes(lp);
                  }
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  c.hide(WindowInsetsCompat.Type.systemBars());
              }
          }
          EOF3
          cat $M
          # конфликт kotlin-stdlib (1.8.22 vs jdk7/jdk8 1.6.21) — приводим всё к одной версии
          cat >> android/app/build.gradle <<'EOF2'
          
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF2
      - name: Сборка APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/release.jks
            ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$PWD/app/release.jks -Pandroid.injected.signing.store.password=$KS_PASS -Pandroid.injected.signing.key.alias=anode -Pandroid.injected.signing.key.password=$KS_PASS
          else
            ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: anode-apk
          path: android/app/build/outputs/apk/**/*.apk
