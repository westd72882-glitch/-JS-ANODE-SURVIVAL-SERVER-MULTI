services:
  - type: web
    name: osil-survival
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: osil-db
          property: connectionString
      - key: DATA_DIR
        value: /data
    disk:                    # нужен только для переноса старого anode.db и как запасной вариант без PostgreSQL
      name: osil-data
      mountPath: /data
      sizeGB: 1

databases:
  - name: osil-db
    plan: basic-256mb
